name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Сверить тег с версией в pom.xml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "тег: $TAG | pom.xml: $POM"
          if [ "$TAG" != "$POM" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией в pom.xml ($POM)"
            exit 1
          fi

      - name: Собрать
        run: mvn -B clean package

      - name: Подготовить описание релиза
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Секция нужной версии из CHANGELOG, без ссылок-сносок в конце файла
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { f = 1; next }
            /^## \[/ { f = 0 }
            /^\[.*\]: http/ { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(--title "PingDisplay ${GITHUB_REF_NAME}")
          # rc/beta/alpha помечаем как предварительный релиз
          case "$GITHUB_REF_NAME" in
            *-rc*|*-beta*|*-alpha*|*-pre*) ARGS+=(--prerelease) ;;
          esac
          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            ARGS+=(--notes-file notes.md)
          else
            ARGS+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" target/*.jar "${ARGS[@]}"
